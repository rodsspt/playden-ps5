name: PlayDen 0.6.0 experimental max32

on:
  push:
    branches: [max32-v060-20261022]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playden-max32-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      JOBS: '3'
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install supported host tools
        run: |
          brew install cmake ninja pkgconf sdl2-compat llvm@18
          echo "LLVM_CONFIG=$(brew --prefix llvm@18)/bin/llvm-config" >> "$GITHUB_ENV"
      - name: Prepare verified dependencies and fonts
        run: |
          bash scripts/fetch-deps.sh
          bash scripts/network-deps/prepare-host-deps.sh
          bash scripts/build-homebrew.sh --prepare-fonts-only
      - name: Configure and build regression tests
        run: |
          cmake --preset homebrew-host
          cmake --build --preset homebrew-host --parallel 3
      - name: Run regression tests
        run: ctest --preset homebrew-host --output-on-failure --timeout 90
      - name: Repeat download workers and thread safety tests
        run: ctest --preset homebrew-host -R '^(depot_installer|mbedtls_threading|download_rate|download_speed_report)$' --repeat until-fail:3 --timeout 90
      - name: Build complete PS5 title with native helpers
        run: |
          bash scripts/build-lapy-helper.sh
          bash scripts/build-homebrew-ps5.sh
      - name: Package experimental title and provenance
        run: |
          test -s build/homebrew-ps5/dist/FAKE77031/eboot.bin
          mkdir -p build/max32-artifact
          printf 'Experimental PlayDen 0.6.0 max32\nSource: https://github.com/%s/commit/%s\nMaximum slots: 32\nDefault slots: 4\nPS5 hardware validation: pending\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > build/max32-artifact/BUILD-INFO.txt
          cp LICENSE build/max32-artifact/LICENSE
          (cd build/homebrew-ps5/dist && zip -qr ../../max32-artifact/playden-0.6.0-max32.zip FAKE77031)
          (cd build/max32-artifact && shasum -a 256 playden-0.6.0-max32.zip > SHA256SUMS)
      - name: Upload verified build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playden-0.6.0-max32
          path: build/max32-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: max32-test-diagnostics
          path: build/homebrew-host/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
